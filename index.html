<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciando sesión con Google...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .loader {
      width: 42px;
      height: 42px;
      border: 3.5px solid #f1f5f9;
      border-top-color: #08655f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const parentOrigin = params.get('parent_origin');
    const hashParams = new URLSearchParams(window.location.hash.substring(1));

    const ALLOWED_PARENTS = [
      'https://app.rematte.lat',
      'https://app-test.rematte.lat',
      'http://localhost:3000',
      'http://localhost:5173'
    ];

    // Si Google ya nos devolvió el id_token en el hash (Callback de OAuth2)
    const idToken = hashParams.get('id_token');
    const error = hashParams.get('error');

    if (idToken || error) {
      if (window.opener) {
        const savedOrigin = sessionStorage.getItem('rematte_parent_origin') || parentOrigin;
        window.opener.postMessage(
          JSON.stringify({
            type: 'REMATTE_GOOGLE_RESULT',
            ok: Boolean(idToken),
            id_token: idToken || null,
            error: error || null
          }),
          savedOrigin || '*'
        );
      }
      window.close();
    } else {
      // Primera llegada: Redirigir de inmediato al Selector de Cuentas Oficial de Google
      if (parentOrigin) {
        sessionStorage.setItem('rematte_parent_origin', parentOrigin);
      }

      const clientId = '344274172874-qqofph676k3m9lad6jquai6siqtpu913.apps.googleusercontent.com';
      const redirectUri = window.location.origin + window.location.pathname;
      const scope = 'openid email profile';
      const responseType = 'id_token';
      const nonce = Math.random().toString(36).substring(2);

      // prompt=select_account fuerza a Google a mostrar SIEMPRE la lista completa arriba
      const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=${encodeURIComponent(responseType)}&scope=${encodeURIComponent(scope)}&nonce=${nonce}&prompt=select_account`;

      window.location.replace(googleAuthUrl);
    }
  </script>
</body>
</html>
