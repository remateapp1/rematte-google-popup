<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continuar con Google - Rematte</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 48px;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 0 16px;
    }
    .header h2 {
      font-size: 20px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px;
      color: #64748b;
    }
    #google_btn_container {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Elige una cuenta</h2>
    <p>para continuar en Rematte</p>
  </div>

  <div id="google_btn_container">
    <div id="google_btn"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const parentOrigin = params.get('parent_origin');

    const ALLOWED_PARENTS = [
      'https://app.rematte.lat',
      'https://app-test.rematte.lat',
      'http://localhost:3000',
      'http://localhost:5173'
    ];

    function sendResult(payload) {
      if (!window.opener) return;
      if (!ALLOWED_PARENTS.includes(parentOrigin)) return;

      window.opener.postMessage(
        JSON.stringify({
          type: 'REMATTE_GOOGLE_RESULT',
          ...payload
        }),
        parentOrigin
      );
    }

    function initGoogle() {
      google.accounts.id.initialize({
        client_id: '344274172874-qqofph676k3m9lad6jquai6siqtpu913.apps.googleusercontent.com',
        ux_mode: 'popup',
        auto_select: false,
        callback: function (response) {
          try {
            if (response && response.credential) {
              sendResult({
                ok: true,
                id_token: response.credential
              });
              window.close();
            } else {
              sendResult({
                ok: false,
                error: 'NO_CREDENTIAL'
              });
            }
          } catch (e) {
            sendResult({
              ok: false,
              error: 'CALLBACK_ERROR'
            });
          }
        }
      });

      google.accounts.id.renderButton(
        document.getElementById('google_btn'),
        {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'continue_with',
          shape: 'pill',
          logo_alignment: 'left',
          width: 320
        }
      );
    }

    window.onload = function () {
      if (!ALLOWED_PARENTS.includes(parentOrigin)) {
        document.body.innerHTML = '<div style="padding:24px;font-family:Arial;text-align:center">Origen no permitido.</div>';
        return;
      }

      initGoogle();
    };
  </script>
</body>
</html>
