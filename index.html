<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continuar con Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffcf4;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      text-align: center;
    }
    #google_btn {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }
    .muted {
      color: #666;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Continuar con Google</h2>
    <div id="google_btn"></div>
    <p class="muted">Elige una cuenta para iniciar sesión en Rematte</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const parentOrigin = params.get('parent_origin');

    const ALLOWED_PARENTS = [
      'https://app.rematte.lat',
      'https://app-test.rematte.lat',
      'http://localhost:3000',
      'http://localhost:5173'
    ];

    function sendResult(payload) {
      if (!window.opener) return;
      if (!ALLOWED_PARENTS.includes(parentOrigin)) return;

      window.opener.postMessage(
        JSON.stringify({
          type: 'REMATTE_GOOGLE_RESULT',
          ...payload
        }),
        parentOrigin
      );
    }

    function initGoogle() {
      google.accounts.id.initialize({
        client_id: '344274172874-qqofph676k3m9lad6jquai6siqtpu913.apps.googleusercontent.com',
        ux_mode: 'popup',
        auto_select: false,
        prompt_parent_id: 'google_btn',
        callback: function (response) {
          try {
            if (response && response.credential) {
              sendResult({
                ok: true,
                id_token: response.credential
              });
              window.close();
            } else {
              sendResult({
                ok: false,
                error: 'NO_CREDENTIAL'
              });
            }
          } catch (e) {
            sendResult({
              ok: false,
              error: 'CALLBACK_ERROR'
            });
          }
        }
      });

      google.accounts.id.renderButton(
        document.getElementById('google_btn'),
        {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'continue_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: 320
        }
      );
    }

    window.onload = function () {
      if (!ALLOWED_PARENTS.includes(parentOrigin)) {
        document.body.innerHTML = '<div style="padding:24px;font-family:Arial">Origen no permitido.</div>';
        return;
      }

      initGoogle();
    };
  </script>
</body>
</html>
